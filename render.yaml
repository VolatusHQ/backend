services:
  - type: web
    name: volatus-roller
    plan: free
    runtime: node
    region: oregon
    rootDir: .
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @volatus/roller... build
    startCommand: node services/roller/dist/index.js serve
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - services/roller/**
        - packages/onchain/**
        - packages/service-kit/**
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
    envVars:
      - key: UNICHAIN_SEPOLIA_RPC
        sync: false
      - key: ROLLER_PRIVATE_KEY
        sync: false
      - key: ALERT_WEBHOOK_URL
        sync: false
      - key: NEXT_EPOCH_BLOCKS
        value: "600"
      - key: NEXT_HORIZON_SECONDS
        value: "600"
      - key: DEMO_BOT_ENABLED
        value: "1"
      - key: ROLLER_SELF_TICK_INTERVAL_MS
        value: "120000"
